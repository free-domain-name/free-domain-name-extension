name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate sharded sample and client freshness
        run: |
          node registry/scripts/validate.mjs
          node registry/scripts/build-client.mjs --check

      - name: Validate sample registry
        run: npm run validate:registry

      - name: Lint Firefox package
        run: npx --yes web-ext@10.8.0 lint --source-dir dist --no-input

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
